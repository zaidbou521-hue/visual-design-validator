<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VDV Test Page</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 50px; }
    .container { max-width: 800px; margin: 0 auto; }
    button { padding: 8px 12px; }
    #overlap-zone { position: relative; width: 200px; height: 200px; }
    .floating-a { position: absolute; top: 0; left: 0; width: 150px; height: 50px; background: red; z-index: 1; }
    .floating-b { position: absolute; top: 30px; left: 20px; width: 150px; height: 50px; background: blue; z-index: 1; }
    img { width: 200px; height: 100px; }
    .nav { display: flex; justify-content: space-between; gap: 5px; }
    .nav a { padding: 2px; }
    input { width: 120px; position: absolute; left: -9999px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>VDV Test Page</h1>

    <div class="nav">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>

    <button>Submit</button>
    <button>Cancel</button>
    <button>Delete</button>

    <div id="overlap-zone">
      <div class="floating-a"></div>
      <div class="floating-b"></div>
    </div>

    <img src="https://placehold.co/200x100" />

    <form>
      <input type="text" name="username">
      <input type="password" name="password">
    </form>
  </div>
</body>
</html>
